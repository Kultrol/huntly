services:
  db:
    image: postgres:18
    environment: DB_NAME = ${DB_NAME}
      POSTGRES_USER = ${POSTGRES_USER}
      POSTGRES_PASSWORD = ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${DB_NAME}

volumes:
  postgres_data:
